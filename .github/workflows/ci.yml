name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check scripts/ --select E,F,W
      - name: Format check
        run: ruff format --check scripts/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: homedir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run migrations
        env:
          PGHOST: localhost
          PGUSER: runner
          PGPASSWORD: runner
          PGDATABASE: homedir_test
        run: psql -f migrations/001_initial_schema.sql
      - name: Run tests
        env:
          HOMEDIR_TEST: "1"
          HOMEDIR_DB: homedir_test
          HOMEDIR_DB_USER: runner
          HOMEDIR_DB_HOST: localhost
          PGPASSWORD: runner
        run: python -m pytest scripts/tests/ -v --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install ruff bandit
      - name: Security scan
        run: bandit -r scripts/ -ll -ii --skip B613
      - name: Check for secrets
        run: |
          if grep -rn "sk-or-v1\|nvapi-\|API_KEY\|SECRET" --include="*.py" --include="*.yml" --include="*.json" scripts/ src/ .github/ 2>/dev/null; then
            echo "FAILED: potential secrets found in tracked files"
            exit 1
          fi
